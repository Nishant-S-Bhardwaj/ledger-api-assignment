name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nishant-s-bhardwaj/ledger-api

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Secret Scanning (Gitleaks)
      # -----------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Static Application Security Testing (Semgrep CE)
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan --config auto app/

      # -----------------------------
      # Login to GitHub Container Registry
      # -----------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Extract Docker Metadata
      # -----------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      # -----------------------------
      # Build and Push Docker Image
      # -----------------------------
      - name: Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # -----------------------------
      # Scan Docker Image with Trivy
      # -----------------------------
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # -----------------------------
      # Install Cosign
      # -----------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # -----------------------------
      # Sign Docker Image (Keyless)
      # -----------------------------
      - name: Sign Container Image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # -----------------------------
      # Generate SLSA Build Provenance
      # -----------------------------
      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # -----------------------------
      # Install Syft
      # -----------------------------
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # -----------------------------
      # Generate SBOM
      # -----------------------------
      - name: Generate SBOM
        run: |
          syft ${{ steps.meta.outputs.tags }} -o spdx-json=sbom.spdx.json

      # -----------------------------
      # Upload SBOM
      # -----------------------------
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json