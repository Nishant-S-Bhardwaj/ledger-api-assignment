apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Rejects images with no tag (implicitly :latest) or an
      explicit :latest tag. Forces every deployment to reference
      an immutable, traceable image reference.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - local-path-storage
                - kyverno
      validate:
        message: "Every container image must specify an explicit, non-empty tag."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ images.containers.\"{{element.name}}\".tag || '' }}"
                    operator: Equals
                    value: ""
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - local-path-storage
                - kyverno
      validate:
        message: "Using the ':latest' tag is not allowed — pin to an immutable, versioned reference."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ images.containers.\"{{element.name}}\".tag }}"
                    operator: Equals
                    value: "latest"